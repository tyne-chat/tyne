# SPDX-License-Identifier: AGPL-3.0-or-later

# Fork: builds the desktop app on GitHub-hosted runners, unsigned, and publishes it as a GitHub
# release that the in-app updater reads (fluxer_desktop/src/main/ShellDownloadFormats.ts).
# Upstream's build-desktop.yaml needs its own runners, signing identities and package server, so
# this is a separate file. It follows that workflow's layout and calls the same tools/ci steps
# wherever they work without signing; compare the two when upstream changes its build.
#
# - Run by hand with a version and release notes to publish a release tagged desktop-v<version>.
# - A push to a desktop-test/** branch builds every platform and keeps the files as workflow
#   artifacts only. Nothing is published, so installed apps never see those builds.
name: fork desktop release
# The version in the run's name is how a release run finds older releases still being built
# (the publish job below waits for them).
run-name: ${{ inputs.version && format('desktop release {0}', inputs.version) || format('desktop test build ({0})', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, for example 1.4.0. Must be higher than the last release for installed apps to update.
        required: true
        type: string
      notes:
        description: Release notes (Markdown). Required when publishing.
        required: false
        default: ""
        type: string
      publish:
        description: Publish a GitHub release. Leave off to only build artifacts.
        required: false
        default: false
        type: boolean
      platform:
        description: Build only this platform, to try a change quickly. A release needs all of them.
        required: false
        default: all
        type: choice
        options: [all, windows, linux, macos]
      macos_signing:
        description: "ad-hoc (the default since 2026-10-25, while Apple's notary service holds the team's submissions): publish the build's ad-hoc signed macOS files. developer-id: sign with the Developer ID and notarize."
        required: false
        default: ad-hoc
        type: choice
        options: [developer-id, ad-hoc]
  push:
    branches:
      - "desktop-test/**"

# Read-only by default. Only the publish job can write, and it runs nothing but gh and GitHub's own
# actions. Every action is pinned to a commit, with its version in a comment; move a pin by looking
# up the new version's commit.
permissions:
  contents: read

# One run per branch and version: a push to a test branch replaces the build before it, while
# two releases of different versions can build side by side.
concurrency:
  group: fork-desktop-release-${{ github.ref }}-${{ inputs.version || 'test' }}
  cancel-in-progress: true

env:
  BUILD_CHANNEL: stable
  VERSION: ${{ inputs.version || format('0.0.{0}', github.run_number) }}
  BUILD_VERSION: ${{ inputs.version || format('0.0.{0}', github.run_number) }}
  PUBLIC_BUILD_VERSION: ${{ inputs.version || format('0.0.{0}', github.run_number) }}
  RELEASE_CHANNEL: stable
  PUBLIC_RELEASE_CHANNEL: stable
  SOURCE_SHA: ${{ github.sha }}
  NODE_ENV: production
  FLUXER_DESKTOP_PRODUCTION: "true"
  # Fork: cargo gives up after three quick tries by default; ride out a longer network blip.
  CARGO_NET_RETRY: "10"
  FLUXER_FORK_RELEASES: ${{ github.repository }}
  # Fork: the link scheme the packages declare. Must be the one the app registers when it runs
  # (CHANNEL_APP_PROTOCOLS in fluxer_desktop/src/common/Constants.ts).
  FLUXER_FORK_LINK_SCHEME: tyne
  # Fork: Linux is packaged with upstream's patched Electron (fluxer_desktop/electron/build-linux.sh),
  # which these runners cannot compile. Upstream publishes its build as the release named in
  # fluxer_desktop/electron/runtime.json and pins the archive's SHA-256 there, and
  # scripts/custom-electron.cjs refuses any other archive. The Linux job downloads it from upstream's
  # public repository, without a token, and checks it against that pin. (Until upstream published
  # it, the maintainers built their own: tyne-chat/tyne#187.)
  FLUXER_FORK_ELECTRON_REPOSITORY: fluxerapp/fluxer
  CI_TOOL: cargo run --locked --quiet --manifest-path "$GITHUB_WORKSPACE/_ci/tools/ci/Cargo.toml" -- build-desktop

jobs:
  # The renderer's WebAssembly parts only compile with a clang that targets wasm32, which the
  # Linux runner has and the Windows and macOS runners do not. As upstream does, build it once
  # here and hand it to every platform build.
  renderer:
    name: Build renderer
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      ARCH: x64
    steps:
      - name: Checkout CI helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: _ci

      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: source

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master on 2026-10-22
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown

      # Fork: the build fetches its crates from crates.io part-way through, once for each native
      # add-on. A runner that could not resolve the registry for a few seconds failed the Windows
      # build of 2.0.7 that way. Keeping what cargo downloaded between runs means a build with
      # unchanged lockfiles fetches nothing, and one with a few changes fetches only those.
      - name: Cache Rust downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: fork-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('source/**/Cargo.lock') }}
          restore-keys: |
            fork-cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Set workdir
        env:
          SUBST_TARGET: ${{ github.workspace }}/source
        run: ${{ env.CI_TOOL }} --step set_workdir_unix

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26

      - name: Set up pnpm
        run: ${{ env.CI_TOOL }} --step setup_pnpm

      - name: Install dependencies
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: ${{ env.CI_TOOL }} --step install_dependencies

      - name: Update version
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: ${{ env.CI_TOOL }} --step update_version

      - name: Set build channel
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: ${{ env.CI_TOOL }} --step set_build_channel

      - name: Build renderer
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: ${{ env.CI_TOOL }} --step build_shared_assets

      - name: Prepare renderer artifact
        run: ${{ env.CI_TOOL }} --step prepare_shared_assets

      - name: Upload renderer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fork-renderer-assets
          path: source/desktop-shared-assets
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    needs: renderer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Every platform, or the one named by the platform input.
        include: >-
          ${{ fromJSON(format('[{0}]',
          inputs.platform == 'windows' && '{"platform":"windows","node_platform":"win32","arch":"x64","os":"windows-2025"}'
          || inputs.platform == 'linux' && '{"platform":"linux","node_platform":"linux","arch":"x64","os":"ubuntu-22.04"}'
          || inputs.platform == 'macos' && '{"platform":"macos","node_platform":"darwin","arch":"arm64","os":"macos-14"}'
          || '{"platform":"windows","node_platform":"win32","arch":"x64","os":"windows-2025"},{"platform":"linux","node_platform":"linux","arch":"x64","os":"ubuntu-22.04"},{"platform":"macos","node_platform":"darwin","arch":"arm64","os":"macos-14"}')) }}
    defaults:
      run:
        shell: bash
    env:
      ARCH: ${{ matrix.arch }}
      ELECTRON_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout CI helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: _ci

      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: source

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master on 2026-10-22
        with:
          toolchain: "1.98.1"

      # Fork: the build fetches its crates from crates.io part-way through, once for each native
      # add-on. A runner that could not resolve the registry for a few seconds failed the Windows
      # build of 2.0.7 that way. Keeping what cargo downloaded between runs means a build with
      # unchanged lockfiles fetches nothing, and one with a few changes fetches only those.
      - name: Cache Rust downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: fork-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('source/**/Cargo.lock') }}
          restore-keys: |
            fork-cargo-${{ runner.os }}-${{ runner.arch }}-

      # Fork: most of "Build Electron main process" is compiling the Rust native add-ons, about
      # ten minutes of it on Windows, and nearly all of that is their third-party crates, which
      # change only with the lockfiles. Each add-on builds into a folder of its own: under
      # C:\fcargo on Windows (tools/ci picks that to keep paths short), beside its source
      # elsewhere. Keeping those folders means the crates are compiled once per lockfile change.
      # The add-ons' own code is still rebuilt every run, since a fresh checkout is newer than
      # anything cached. The key names the compiler so a toolchain change starts clean.
      - name: Cache compiled Rust add-ons
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            C:\fcargo
            source/fluxer_desktop/native/*/target
          key: fork-addons-${{ runner.os }}-${{ runner.arch }}-rust1.98.1-${{ hashFiles('source/fluxer_desktop/native/**/Cargo.lock') }}
          restore-keys: |
            fork-addons-${{ runner.os }}-${{ runner.arch }}-rust1.98.1-

      - name: Set up Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Ensure python3 command (Windows)
        if: runner.os == 'Windows'
        run: ${{ env.CI_TOOL }} --step ensure_python3_windows

      - name: Shorten Windows paths and pin pnpm store
        if: runner.os == 'Windows'
        env:
          SUBST_TARGET: ${{ github.workspace }}/source
        run: ${{ env.CI_TOOL }} --step windows_paths

      - name: Set workdir (Unix)
        if: runner.os != 'Windows'
        env:
          SUBST_TARGET: ${{ github.workspace }}/source
        run: ${{ env.CI_TOOL }} --step set_workdir_unix

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26

      - name: Set up pnpm
        run: ${{ env.CI_TOOL }} --step setup_pnpm

      - name: Install Python setuptools (macOS)
        if: matrix.platform == 'macos'
        run: ${{ env.CI_TOOL }} --step install_setuptools_macos

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: ${{ env.CI_TOOL }} --step install_linux_deps

      - name: Set up MSVC env (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: amd64

      - name: Install dependencies
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: ${{ env.CI_TOOL }} --step install_dependencies

      - name: Update version
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: ${{ env.CI_TOOL }} --step update_version

      - name: Set build channel
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: ${{ env.CI_TOOL }} --step set_build_channel

      - name: Download renderer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fork-renderer-assets
          path: source/desktop-shared-assets

      - name: Restore renderer
        run: ${{ env.CI_TOOL }} --step restore_shared_assets

      # Upstream's build_electron_main step sets FLUXER_MODULES=1, which strips the renderer out of
      # the app so it can be downloaded as modules from upstream's server. This fork packs the
      # renderer into the app, so run the same build without that flag.
      - name: Build Electron main process
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: pnpm exec node scripts/build.mjs --use-shared-renderer

      - name: Build Electron app (Windows)
        if: matrix.platform == 'windows'
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: ${{ env.CI_TOOL }} --step build_app_windows

      - name: Set up .NET SDK (Windows)
        if: matrix.platform == 'windows'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Install Velopack CLI
        if: matrix.platform == 'windows'
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: ${{ env.CI_TOOL }} --step install_velopack_cli

      # Upstream's package_app_windows_velopack step refuses to run without its signing service.
      # These are the same vpk arguments (tools/ci/src/desktop.rs) without the signing one.
      - name: Package Windows app with Velopack (unsigned)
        if: matrix.platform == 'windows'
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: |
          unpacked="$(find dist-electron -maxdepth 2 -type f -name 'Tyne.exe' -path '*unpacked*' -print -quit)"
          test -n "$unpacked" || { echo "No unpacked Windows app with Tyne.exe under dist-electron"; ls -R dist-electron | head -50; exit 1; }
          ./.velopack/vpk --yes pack \
            --packId tyne_desktop \
            --packVersion "$VERSION" \
            --packDir "$(dirname "$unpacked")" \
            --mainExe "Tyne.exe" \
            --packTitle "Tyne" \
            --packAuthors "Tyne Chat" \
            --shortcuts Desktop,StartMenu \
            --runtime "win-${ARCH}" \
            --icon build_resources/icons-tyne/icon.ico \
            --outputDir "dist-electron/velopack-windows-${ARCH}" \
            --delta None
          ls -la "dist-electron/velopack-windows-${ARCH}"

      - name: Download patched Electron distribution (Linux)
        if: matrix.platform == 'linux'
        run: |
          dist="$RUNNER_TEMP/fluxer-electron-dist"
          runtime="$WORKDIR/fluxer_desktop/electron/runtime.json"
          release_tag=$(jq -er .releaseTag "$runtime")
          version=$(jq -er .electronVersion "$runtime")
          archive_sha256=$(jq -er --arg arch "$ARCH" '.linux[$arch].archiveSha256' "$runtime")
          base="https://github.com/$FLUXER_FORK_ELECTRON_REPOSITORY/releases/download/$release_tag"
          name="electron-v${version}-linux-${ARCH}"
          mkdir -p "$dist"
          curl -fsSL --retry 5 -o "$dist/$name.zip" "$base/$name.zip"
          curl -fsSL --retry 5 -o "$dist/$name.fluxer.json" "$base/$name.fluxer.json"
          printf '%s  %s\n' "$archive_sha256" "$dist/$name.zip" | sha256sum -c -

      - name: Build Electron app (Linux)
        if: matrix.platform == 'linux'
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        env:
          USE_SYSTEM_FPM: "true"
          FLUXER_ELECTRON_DIST: ${{ runner.temp }}/fluxer-electron-dist
        run: ${{ env.CI_TOOL }} --step build_app_linux

      # Upstream's build_app_macos step requires its signing keychain. This build is signed ad hoc
      # (electron-builder.config.cjs); for runs from tyne the sign-macos job below signs it again
      # with the Developer ID and notarizes it, apart from the dependencies installed here.
      - name: Build Electron app (macOS, ad-hoc signed)
        if: matrix.platform == 'macos'
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --config electron-builder.config.cjs --mac "--${ARCH}"

      - name: Check the macOS signature
        if: matrix.platform == 'macos'
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: |
          app="$(find dist-electron -maxdepth 2 -name '*.app' -type d | head -n 1)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 --entitlements - "$app"

      - name: Prepare release assets
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          node scripts/fork-release-assets.mjs
          --platform "${{ matrix.node_platform }}" --arch "$ARCH" --version "$VERSION"
          --input dist-electron --output release_assets

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fork-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: source/fluxer_desktop/release_assets
          if-no-files-found: error
          retention-days: 14

  # Signs the macOS build with the Tyne team's Developer ID, notarizes it, and replaces the build's
  # files with the signed ones (tyne-chat/tyne#202). The signing identity is only in the
  # desktop-release environment, which runs from tyne only, and this job runs only Apple's tools
  # (scripts/fork-sign-macos.sh) and GitHub's own actions: no dependency installs. Test builds from
  # desktop-test/** branches keep the ad-hoc signed files; a release needs this job.
  sign-macos:
    name: Sign and notarize macOS
    if: ${{ github.ref == 'refs/heads/tyne' && (inputs.platform == 'all' || inputs.platform == 'macos') && inputs.macos_signing != 'ad-hoc' }}
    needs: build
    runs-on: macos-14
    # Two notarizations of up to two hours each (scripts/fork-sign-macos.sh).
    timeout-minutes: 300
    environment: desktop-release
    steps:
      - name: Checkout the signing script and entitlements
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: source
          sparse-checkout: |
            fluxer_desktop/scripts/fork-sign-macos.sh
            fluxer_desktop/build_resources/entitlements.mac.development.plist
            fluxer_desktop/build_resources/entitlements.mac.inherit.plist
          sparse-checkout-cone-mode: false

      - name: Download macOS build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fork-desktop-macos-arm64
          path: release_assets

      # The entitlements are the ones electron-builder.config.cjs gives the fork's stable channel.
      - name: Sign, notarize and staple
        env:
          ARCH: arm64
          TEAM_ID: 2VU375L9T2
          DEVELOPER_ID_P12: ${{ secrets.TYNE_MACOS_DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.TYNE_MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.TYNE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.TYNE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.TYNE_NOTARY_ISSUER_ID }}
        run: >-
          source/fluxer_desktop/scripts/fork-sign-macos.sh release_assets
          source/fluxer_desktop/build_resources/entitlements.mac.development.plist
          source/fluxer_desktop/build_resources/entitlements.mac.inherit.plist

      - name: Replace the macOS build with the signed files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fork-desktop-macos-arm64
          path: release_assets
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # Downloads the signed DMG as a user would, has Gatekeeper judge it, installs the app and checks
  # that it starts and keeps running. Its own workflow, so it can also be run by hand on the signed
  # files of an earlier run.
  test-macos:
    name: Open the signed macOS app
    needs: sign-macos
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/fork-desktop-macos-launch-test.yaml

  # A test run from tyne without publishing signs the checksums of its files the way publish does,
  # with no write token, and keeps them with the run, so release signing is exercised before a
  # release depends on it. It runs once the other jobs are done, whichever platforms were built, and
  # whatever became of the macOS signing: a slow notarization must not keep this from being tested.
  check-release-signing:
    name: Sign checksums (test run, nothing published)
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'workflow_dispatch' && !inputs.publish && github.ref == 'refs/heads/tyne' }}
    needs: [build, sign-macos, test-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: desktop-release
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fork-desktop-*
          path: release_assets
          merge-multiple: true

      # Installed apps install only what this signed list gives (src/main/ForkReleaseSignature.ts).
      - name: Checkout the release signing script and keys
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: source
          sparse-checkout: |
            fluxer_desktop/scripts/fork-sign-release-checksums.sh
            fluxer_desktop/scripts/fork-release-signing-keys.pem
            fluxer_desktop/scripts/fork-verify-release-signature.sh
          sparse-checkout-cone-mode: false

      - name: Write and sign checksums
        env:
          SIGNING_KEY: ${{ secrets.TYNE_RELEASE_SIGNING_KEY }}
        run: source/fluxer_desktop/scripts/fork-sign-release-checksums.sh release_assets

      - name: Keep the signed checksums with the run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-checksums
          path: |
            release_assets/SHA256SUMS.txt
            release_assets/SHA256SUMS.txt.sig
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    # Only from tyne. With Developer ID signing (the default) it needs sign-macos and its test, so
    # the macOS build is signed and opens; with macos_signing=ad-hoc those two are skipped and the
    # build's own macOS files are published.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.publish && inputs.platform == 'all' && github.ref == 'refs/heads/tyne' && needs.build.result == 'success' && (inputs.macos_signing == 'ad-hoc' || (needs.sign-macos.result == 'success' && needs.test-macos.result == 'success')) }}
    needs: [build, sign-macos, test-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    # Holds the release signing key; only runs from the tyne branch can use it.
    environment: desktop-release
    steps:
      - name: Require release notes
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "${NOTES//[[:space:]]/}" ]; then
            echo "Release notes are required to publish a release."
            exit 1
          fi

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fork-desktop-*
          path: release_assets
          merge-multiple: true

      # Installed apps install only what this signed list gives (src/main/ForkReleaseSignature.ts).
      - name: Checkout the release signing script and keys
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: source
          sparse-checkout: |
            fluxer_desktop/scripts/fork-sign-release-checksums.sh
            fluxer_desktop/scripts/fork-release-signing-keys.pem
            fluxer_desktop/scripts/fork-verify-release-signature.sh
          sparse-checkout-cone-mode: false

      - name: Write and sign checksums
        env:
          SIGNING_KEY: ${{ secrets.TYNE_RELEASE_SIGNING_KEY }}
        run: source/fluxer_desktop/scripts/fork-sign-release-checksums.sh release_assets

      # Releases may build side by side, and the updater takes the release created last for the
      # newest. So a release is only created once no lower version is still on its way.
      - name: Wait for older releases still being built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            pending="$(
              for status in in_progress queued; do
                gh run list --repo "${{ github.repository }}" --workflow fork-desktop-release.yaml \
                  --status "$status" --limit 50 --json displayTitle \
                  --jq '.[].displayTitle | select(startswith("desktop release ")) | sub("desktop release "; "")'
              done | sort -u
            )"
            older=""
            for other in $pending; do
              if [ "$other" != "$VERSION" ] && [ "$(printf '%s\n%s\n' "$other" "$VERSION" | sort -V | head -1)" = "$other" ]; then
                older="$older $other"
              fi
            done
            if [ -z "$older" ]; then
              echo "No older release is being built."
              exit 0
            fi
            echo "Waiting for older release(s):$older (attempt $attempt)"
            sleep 30
          done
          echo "Older releases were still being built after an hour:$older"
          exit 1

      # Not a draft or a pre-release: installed apps follow "the latest release" of this
      # repository, and GitHub only counts a published, full release as latest.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: >-
          gh release create "desktop-v${VERSION}"
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}"
          --title "Tyne Desktop v${VERSION}"
          --notes "$NOTES"
          --latest
          release_assets/*

  # The updater library decides for itself how to read the update source, so ask it. This fails
  # the run when an installed app could not find the release that was just published. It installs
  # that library from npm, so it runs apart from the publish job and its token.
  verify:
    name: Check that installed apps see the release
    # Without a condition a job runs only if every job before it succeeded, and with
    # macos_signing=ad-hoc the macOS signing is skipped; so this asks only for the publish job.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the update check
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: source
          sparse-checkout: |
            fluxer_desktop/scripts
            fluxer_desktop/package.json

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26

      - name: Verify that installed apps can find the release
        run: |
          velopack_version="$(node -p "require('./source/fluxer_desktop/package.json').dependencies.velopack")"
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/updater" "velopack@${velopack_version}"
          node source/fluxer_desktop/scripts/fork-verify-update-feed.cjs \
            --repository "${{ github.repository }}" \
            --expect "$VERSION" \
            --velopack "$RUNNER_TEMP/updater/node_modules/velopack"

      - name: Verify the published signature
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/desktop-v${VERSION}"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/SHA256SUMS.txt" "$base/SHA256SUMS.txt"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/SHA256SUMS.txt.sig" "$base/SHA256SUMS.txt.sig"
          source/fluxer_desktop/scripts/fork-verify-release-signature.sh \
            source/fluxer_desktop/scripts/fork-release-signing-keys.pem \
            "$RUNNER_TEMP/SHA256SUMS.txt" "$RUNNER_TEMP/SHA256SUMS.txt.sig"
