# SPDX-License-Identifier: AGPL-3.0-or-later
name: Nightly Rebase & AI Conflict Resolver

# SCHEDULING NOTE:
# GitHub Actions disables `on: schedule` triggers on forked repositories at the
# platform level. Since this repo is a public fork of fluxerapp/fluxer, cron
# schedules defined here will NEVER fire regardless of workflow state.
#
# Nightly runs are instead triggered by a cron schedule in the standalone
# (non-fork) repository: chiaracoetzee/workflow-scheduler
# That repo dispatches this workflow daily at 4:15 AM PDT (11:15 UTC) via
# `gh workflow run`.

on:
  workflow_dispatch:
    inputs:
      test_issue:
        description: 'Only test the issue account: skip the rebase, open a test escalation as tyne-rebase[bot] and close it. Starts no other repository.'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (rebase and run tests, but do NOT push to remote)'
        required: true
        default: false
        type: boolean
      force_test_agent:
        description: 'Run self-test on Gemini 3.8 Flash API connectivity'
        required: false
        default: false
        type: boolean
      force_tests:
        description: 'Force execution of baseline, unit, and E2E tests even if 0 commits behind upstream'
        required: false
        default: false
        type: boolean
      skip_e2e:
        description: 'Skip full-stack Playwright E2E test gate'
        required: false
        default: false
        type: boolean
      skip_baseline_e2e:
        description: 'Skip pre-rebase baseline E2E gate only'
        required: false
        default: false
        type: boolean
      smoke:
        description: 'Smoke run: skip the baseline gates, rebase and regenerate, then stop before the test gates. Never pushes.'
        required: false
        default: false
        type: boolean

# Read-only by default. The rebase job runs code nobody here controls (upstream's new commits,
# installs and build scripts, the test suites, the agent), so it holds no token that can write:
# its GITHUB_TOKEN reads, and the private tools come in with a read-only deploy key. The publish
# job is the only one with WORKFLOW_TOKEN, and it runs nothing but GitHub's own actions and
# publish_result.py from a fresh checkout of the tools, which checks what the rebase job left
# before pushing it. Every action is pinned to a commit, with its version in a comment.
permissions:
  contents: read

jobs:
  nightly-rebase:
    if: ${{ !inputs.test_issue }}
    runs-on: ubuntu-24.04
    # Chain worst case from the 01:00 Pacific dispatch: monorepo 195 + SDK 30 + Flutter 135 min, plus 10 for
    # each publish job, ends 07:30, before the 07:40 mobile sync.
    timeout-minutes: 195

    steps:
      - name: Checkout tyne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tyne
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout shared rebase tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tyne-chat/tyne-tools
          ref: main
          ssh-key: ${{ secrets.TOOLS_DEPLOY_KEY }}
          persist-credentials: false
          path: .shared_tools

      - name: Stage shared rebase tools to /tmp
        run: |
          mkdir -p /tmp/rebase_tools
          cp -r .shared_tools/* /tmp/rebase_tools/
          rm -rf .shared_tools

      - name: Set up Python for AI Resolver
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Google Antigravity SDK
        run: pip install google-antigravity

      - name: Verify Gemini Flash API Connectivity
        if: ${{ inputs.force_test_agent == true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python /tmp/rebase_tools/rebase/rebase_agent.py --self-test
          echo "Resting 10s to ensure clean quota before rebase..."
          sleep 10

      # The toolchain, components and targets of upstream's rust job (tests.yaml): the gate runs
      # its rustfmt and Clippy checks, desktop-native workspaces included, with the same versions.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master on 2026-09-12, as in upstream's tests.yaml
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown, x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            fluxer_gateway/native/guild_member_list_oset_nif -> target
            fluxer_gateway/native/push_markdown_plaintext_nif -> target
          save-if: true

      # The native libraries upstream's rust job installs (media proxy, desktop native), copied
      # from its tests.yaml: Clippy and the Rust tests in the gate build and run against them.
      - name: Cache native media dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/fluxer-native
          key: media-native-${{ runner.os }}-${{ hashFiles('fluxer_media_proxy/tools/install-native-deps.sh') }}

      # A slow mirror can stall apt for over an hour (2026-10-26: 146 MB at 35 kB/s, 69 minutes),
      # which the job timeout pays for. Only the download is bounded, so a timeout never stops dpkg
      # halfway; after a try that fails or runs out of time, Azure's mirror is dropped from the
      # runner's mirror list so apt uses the next one. Packages already downloaded stay in apt's
      # cache for the retry. If every try fails, the step fails and the publish job escalates.
      - name: Install native dependencies
        run: |
          packages=(
            build-essential
            binutils
            clang
            cmake
            curl
            libaom-dev
            libavfilter-dev
            libclang-dev
            libcurl4-openssl-dev
            libdav1d-dev
            libde265-dev
            libfido2-dev
            libheif-dev
            liblcms2-dev
            libpipewire-0.3-dev
            libspa-0.2-dev
            libssl-dev
            libudev-dev
            libvips-dev
            libwebp-dev
            libyuv-dev
            meson
            nasm
            ninja-build
            pkg-config
            xz-utils
            yasm
            zlib1g-dev
          )
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          for attempt in 1 2 3; do
            if sudo timeout 3m apt-get "${apt_opts[@]}" update \
              && sudo timeout 10m apt-get "${apt_opts[@]}" install -y --no-install-recommends --download-only "${packages[@]}"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::apt-get failed or timed out three times."
              exit 1
            fi
            echo "::warning::apt-get failed or timed out (try $attempt of 3); retrying without Azure's mirror."
            if [ -f /etc/apt/apt-mirrors.txt ] && grep -qv 'azure\.archive\.ubuntu\.com' /etc/apt/apt-mirrors.txt; then
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
              cat /etc/apt/apt-mirrors.txt
            fi
          done
          sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends "${packages[@]}"
          sudo fluxer_media_proxy/tools/install-native-deps.sh /opt/fluxer-native
          echo "PKG_CONFIG_PATH=/opt/fluxer-native/lib/pkgconfig:/opt/fluxer-native/lib64/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/fluxer-native/lib:/opt/fluxer-native/lib64" >> "$GITHUB_ENV"
          echo "/opt/fluxer-native/bin" >> "$GITHUB_PATH"

      # The cargo-deny version upstream's rust job installs. The cargo cache keeps the binary, so
      # this is quick after the first run.
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      # Erlang/OTP and rebar3 as upstream's gateway job pins them, for the gateway's erlfmt,
      # compile, Dialyzer and eunit steps in the gate.
      - name: Set up Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '28'
          rebar3-version: '3.27.0'

      - name: Cache rebar3 dependencies and the Dialyzer PLT
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/rebar3
            fluxer_gateway/_build
            !fluxer_gateway/_build/default/lib/fluxer_gateway/**
            !fluxer_gateway/_build/test/lib/fluxer_gateway/**
          key: >-
            rebar3-${{ runner.os }}-otp28-rebar3.27.0-${{ hashFiles('fluxer_gateway/rebar.lock',
            'fluxer_gateway/rebar.config') }}
          restore-keys: |
            rebar3-${{ runner.os }}-otp28-rebar3.27.0-

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Upstream's CI (tests.yaml) runs on Node 26.
          node-version: 26
          cache: pnpm

      # On a night with nothing to rebase nothing is installed, so the pnpm store does not
      # exist, and the cache step of "Set up Node.js" then fails the whole job at cleanup.
      - name: Make sure the pnpm store exists
        run: mkdir -p "$(pnpm store path --silent)"

      - name: Free Disk Space for Docker Images
        run: |
          echo "Freeing disk space on runner for Docker builds & Playwright..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose GitHub Runtime Token for Docker BuildKit
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # The pipeline runs as one step per phase, so this page shows which phase is
      # running, how long each took, and whether the repair agent was needed (its
      # steps are skipped when it was not). The phases share their state through
      # /tmp/rebase_pipeline_state.json; see rebase_orchestrator.py --phase.
      - name: Pipeline settings
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ inputs.force_tests }}" = "true" ] || [ "${{ inputs.force_test_agent }}" = "true" ]; then
            FLAGS="$FLAGS --force-tests"
          fi
          if [ "${{ inputs.skip_e2e }}" = "true" ]; then
            FLAGS="$FLAGS --skip-e2e"
          fi
          if [ "${{ inputs.skip_baseline_e2e }}" = "true" ]; then
            FLAGS="$FLAGS --skip-baseline-e2e"
          fi
          if [ "${{ inputs.smoke }}" = "true" ]; then
            FLAGS="$FLAGS --skip-baseline --stop-after-codegen"
          fi
          echo "REBASE_ARGS=--profile subprofiles --time-budget-minutes 185 --result-dir /tmp/rebase_result $FLAGS" >> "$GITHUB_ENV"

      - name: "1. Check upstream and tag a backup"
        id: prepare
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase prepare

      - name: "2. Baseline tests (before the rebase)"
        id: baseline
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase baseline

      - name: "3. Rebase onto upstream"
        id: rebase
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase rebase

      - name: "3a. Agent: resolve conflicts"
        id: resolve_conflicts
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' && steps.rebase.outputs.needs_agent == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase resolve-conflicts

      - name: "4. Dependencies and code generation"
        id: codegen
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase codegen

      - name: "4a. Agent: repair code generation"
        id: repair_codegen
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' && steps.codegen.outputs.needs_agent == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase repair-codegen

      - name: "5. Tests and analysis"
        id: unit
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase unit

      - name: "5a. Agent: repair tests"
        id: repair_unit
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' && steps.unit.outputs.needs_agent == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase repair-unit

      - name: "6. End-to-end tests"
        id: e2e
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase e2e

      - name: "6a. Agent: repair end-to-end tests"
        id: repair_e2e
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' && steps.e2e.outputs.needs_agent == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase repair-e2e

      - name: "7. Hand the rebased branch to the publish job"
        id: push
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase push

      - name: Upload the result for the publish job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebase-result
          if-no-files-found: ignore
          path: /tmp/rebase_result
          retention-days: 14

      - name: Upload E2E Test Report & Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-e2e-report
          if-no-files-found: ignore
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

      - name: Upload AI Agent Logs & Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebase-agent-logs
          if-no-files-found: ignore
          path: |
            /tmp/rebase_transcript.md
            /tmp/rebase_escalation_reason.md
            /tmp/test_failures.log
            /tmp/e2e_failures.log
            /tmp/antigravity_data

  # Pushes the rebased branch and the backup tag, opens the escalation and absorbed-commit issues
  # and starts the next repository's rebase: everything that needs WORKFLOW_TOKEN. It runs no code
  # from the rebase job or the rebased branch; publish_result.py says what it checks.
  publish:
    needs: nightly-rebase
    # Also after a failed, crashed or timed-out rebase job: the escalation and the next link's
    # start happen here.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout shared rebase tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tyne-chat/tyne-tools
          ref: main
          ssh-key: ${{ secrets.TOOLS_DEPLOY_KEY }}
          persist-credentials: false
          path: tools

      - name: Checkout tyne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tyne
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN }}
          path: repo

      # Missing when the rebase job stopped before it wrote anything; the next step escalates then.
      - name: Download the rebase job's result
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rebase-result
          path: result

      # Escalations and the absorbed-commits issue are opened as tyne-rebase[bot] (the Tyne Rebase
      # App: Issues only, installed on tyne-chat/tyne), not as WORKFLOW_TOKEN's account. If this
      # step fails, they fall back to WORKFLOW_TOKEN (tyne-tools rebase/pipeline_issues.py).
      - name: Token for the pipeline's issues
        id: issues-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23lislBoXAblKx3tR3
          private-key: ${{ secrets.REBASE_APP_KEY }}
          owner: tyne-chat
          repositories: tyne
          permission-issues: write

      - name: Check, push, report and start the next repository
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          ISSUES_GH_TOKEN: ${{ steps.issues-token.outputs.token }}
          REBASE_JOB: ${{ needs.nightly-rebase.result }}
          TEST_ISSUE: ${{ inputs.test_issue }}
          DRY_RUN: ${{ inputs.dry_run || inputs.smoke }}
        run: |
          FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="--dry-run"
          fi
          # Last: a test-issue run does nothing else, whatever dry_run says.
          if [ "$TEST_ISSUE" = "true" ]; then
            FLAGS="--test-issue"
          fi
          python3 ../tools/rebase/publish_result.py --profile subprofiles --result-dir ../result --rebase-job "$REBASE_JOB" $FLAGS
