[toolchain]
channel = "1.98.1"
profile = "minimal"
# Fork: the tools CHECKS.md runs with this toolchain (rustfmt, Clippy, and Clippy on the desktop's
# Windows add-ons), so every checkout installs them with it. Upstream's CI installs them in its
# workflow instead. If upstream adds its own `components` or `targets`, keep one of each.
components = ["rustfmt", "clippy"]
targets = ["x86_64-pc-windows-msvc"]
